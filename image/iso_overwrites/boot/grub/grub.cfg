set pref=/boot/grub

if loadfont $pref/fonts/unicode.pf2 ; then
	set gfxmode=auto
	insmod efi_gop
	insmod efi_uga
	insmod gfxterm
	terminal_output gfxterm
fi

insmod png
if background_image $pref/grub_bg.png; then
  set color_normal=white/black
  set color_highlight=white/green
else
	set color_normal=white/green
	set color_highlight=white/black
fi

set timeout=5

menuentry "Install OS2borgerPC VERSION from this medium" {
	set gfxpayload=keep
	linux	/casper/vmlinuz quiet splash noprompt fsck.mode=skip autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}
menuentry "Ubuntu (safe graphics)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz quiet splash nomodeset fsck.mode=skip autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
fi
